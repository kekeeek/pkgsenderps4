name: PKG Sender for PS4
options:
  bundleIdPrefix: com.pkgsenderps4
  deploymentTarget:
    iOS: "15.0"

targets:
  PKGSenderForPS4:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: PKG Sender for PS4
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "PKG Sender needs access to your local network to send .pkg files to your PS4 over FTP."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pkgsenderps4.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
